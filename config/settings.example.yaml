shop:
  name: "My Shop"
  location: "Town"
  address_line: "Town  A12 B345"   # printed under the shop name on receipts
  timezone: "Europe/Dublin"

database:
  path: "db/bookshop.db"

catalog:
  inhouse_prefix: "2000001"   # prefix for in-house EAN-13 barcodes (GS1 in-store range)

api:
  lookup_enabled: true         # set false for gallery/museum (manual entry only)
  # Open Library - free, no key required
  open_library_url: "https://openlibrary.org/api/books"
  # Google Books - optional, add key if needed
  google_books_url: "https://www.googleapis.com/books/v1/volumes"
  google_books_key: ""
  timeout_seconds: 5

# Vocabulary used in all UI labels and CSV headers.
# Change these per-deployment without touching code.
ui:
  app_title: "Bookshop"
  item_singular: "book"
  item_plural: "books"
  barcode_label: "ISBN"
  creator_label: "Author"
  vendor_label: "Publisher"
  misc_items_label: "NON-ISBN ITEMS"

office_sync:
  mount_path: "/mnt/office"          # where office share is mounted
  report_subdir: "bookshop_reports"  # subfolder on the share
  fallback_local: "sync/"            # used if mount unavailable
  sync_time: "23:00"                 # daily sync time (cron)

stock:
  low_stock_threshold: 2             # flag when copies drop to this

# How many shortcut buttons (number keys 1-9) the counter shows for
# non-barcoded items. Depends on the counter screen's size, so set per machine.
counter_item_slots: 4

# Non-barcoded items, by number key at the counter. Read ONCE, the first time
# the app starts (v1.8.0+); after that they're edited in Admin → 6 Counter
# items and changing this list has no effect.
# Leave price blank to prompt staff to enter it at time of sale
non_isbn_items:
  - name: "Postcard"
    price: 4.00
  - name: "Postcard (large)"
    price: 6.00
  - name: "Tour admission"
    price:                           # variable — staff enter per person at counter

admin:
  pin: "0000"                        # CHANGE THIS before going live

logging:
  log_dir: "logs/"
  level: "INFO"

payment_types:
 - "Room Hire"
 - "Membership"
 - "Event Booking"
 - "Donation"
 - "Other"

payments:
 location_tag: "COUNTER"
 require_reference: false

printer:
  enabled: false                     # set true only on machines with the receipt printer's CUPS queue set up
  queue_name: "colophon_receipt"     # CUPS queue name — see README.md "Receipt printer (optional)"
  paper_width_chars: 42              # 80mm paper, 42 columns — use 32 for 58mm paper
  cut_mode: "partial"                # "partial" or "full"
  footer_line: "Thank you for your visit"
  cash_drawer: false                 # true if a cash drawer is plugged into the printer's DK port; opens on Cash
  drawer_pin: 2                      # 2 for most drawers; try 5 if it doesn't open

dashboard:
  enabled: false                     # set true to serve the read-only sales/stock dashboard
  port: 8088                         # LAN only — never port-forward this; see README.md "Sales dashboard (optional)"
  refresh_seconds: 30                # how often the page auto-refreshes (<meta http-equiv="refresh">)
