<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ shop_name }} — Dashboard</title>
{% if is_default %}
<meta http-equiv="refresh" content="{{ refresh_seconds }}">
{% endif %}
<style>
  :root { color-scheme: dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 1rem;
    background: #0f0f2a;
    color: #e8dcc8;
  }
  h1 { color: #d4af37; margin-bottom: 0.25rem; }
  .meta { color: #9a9ac0; font-size: 0.85rem; margin-bottom: 1.5rem; }
  .panel {
    background: #15153a;
    border: 1px solid #2a2a5a;
    border-radius: 6px;
    padding: 1rem;
    margin-bottom: 1.5rem;
  }
  .panel h2 { margin-top: 0; color: #d4af37; font-size: 1.1rem; }
  .stats { display: flex; gap: 2rem; flex-wrap: wrap; }
  .stat { min-width: 120px; }
  .stat .value { font-size: 1.6rem; font-weight: bold; color: #e8dcc8; }
  .stat .label { font-size: 0.8rem; color: #9a9ac0; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #2a2a5a; }
  th { color: #c8b89a; font-weight: 600; }
  .right { text-align: right; }
  .error {
    background: #3a1a1a; border: 1px solid #8b0000; color: #ff6b6b;
    padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1.5rem;
  }
  .low { color: #ff6b6b; font-weight: bold; }
  form.range { display: flex; gap: 0.75rem; align-items: end; flex-wrap: wrap; }
  form.range label { display: block; font-size: 0.8rem; color: #9a9ac0; margin-bottom: 0.25rem; }
  input[type=date] {
    background: #09091f; border: 1px solid #3a3a6a; color: #e8dcc8;
    padding: 0.4rem; border-radius: 4px;
  }
  button, .btn {
    background: #0a1f0a; border: 1px solid #4aaa7a; color: #4aaa7a;
    padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer;
    text-decoration: none; display: inline-block; font-size: 0.9rem;
  }
</style>
</head>
<body>
<h1>{{ shop_name }}</h1>
<div class="meta">
  {% if start == end %}Showing {{ start }}{% else %}Showing {{ start }} to {{ end }}{% endif %}
  {% if is_default %} · auto-refreshes every {{ refresh_seconds }}s{% endif %}
</div>
{% block content %}{% endblock %}
</body>
</html>
